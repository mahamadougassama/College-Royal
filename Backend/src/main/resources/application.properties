spring.application.name=Ecole

# Connexion MySQL — surchargée par les variables d'env du docker-compose
spring.datasource.url=jdbc:mysql://db:3306/ecole1?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
# ⚠️ Mot de passe fourni par la variable d'env SPRING_DATASOURCE_PASSWORD
# spring.datasource.password=   ← laisser vide/commenté, la valeur vient du .env

# Driver JDBC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Encodage UTF-8
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4

# Optionnel — contexte /Ecole (si tu l'as, cohérent avec nginx.conf)
server.servlet.context-path=/Ecole
server.port=8080